aid: nitro-software
name: Nitro Software
description: >-
  Nitro Software is a document productivity company (San Francisco, CA; part of the Nitro
  Productivity Platform) offering PDF editing, eSignature (Nitro Sign), and document
  intelligence. Nitro publishes a public developer platform of REST APIs at
  developers.gonitro.com covering two surfaces: a PDF Services / Document Intelligence
  Platform API (convert, extract, transform, redact, OCR, generate/fill forms) and the
  Nitro Sign API (envelopes, documents, participants, fields, sealing, audit trails, and
  signer signing URLs). The APIs use machine-to-machine OAuth 2.0 client-credentials with
  short-lived bearer JWTs, RFC 9457 problem+json errors, cursor pagination, asynchronous
  jobs with callbacks, and RFC 9421 signed Sign webhooks. API access requires a Nitro Sign
  Enterprise plan.
